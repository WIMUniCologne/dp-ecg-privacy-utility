# conda environment for the DP-ECG study.
#
#   conda env create -f environment.yml
#   conda activate dp-ecg
#
# Versions are the ones the reported results were produced with. TensorFlow is
# installed through pip because the conda-forge builds lag behind and the GPU
# wheels are only published on PyPI.
name: dp-ecg
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy=2.0.2
  - scipy=1.13.1
  - scikit-learn=1.6.1
  - pandas=2.2.3
  - matplotlib=3.9.4
  - seaborn=0.13.2
  - joblib=1.4.2
  - notebook=7.5.6
  - pytest=8.3.4
  - pip:
      - tensorflow==2.18.0
      - wfdb==4.3.0
      - diffprivlib==0.6.5
      - imbalanced-learn==0.12.4
